<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube</title>
  <link rel="shortcut icon" href="https://www.youtube.com/s/desktop/3a93864d/img/favicon.ico" type="image/x-icon">
