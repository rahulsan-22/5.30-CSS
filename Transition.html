<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transition</title>
  <link rel="stylesheet" href="./Transition.css">
</head>

<body>
  <!-- !Example 1 -->
  <!-- <div id="box"></div> -->
  <!-- !Example 2 -->
   <div class="container">
    <h1>Ease</h1>
    <div class="line">
      <div class="circle ease"></div>
    </div>
   </div>
   <div class="container">
    <h1>Ease-In</h1>
    <div class="line">
      <div class="circle ease-in"></div>
    </div>
   </div>
   <div class="container">
    <h1>Ease-Out</h1>
    <div class="line">
      <div class="circle ease-out"></div>
    </div>
   </div>
   <div class="container">
    <h1>Ease-In-Out</h1>
    <div class="line">
      <div class="circle ease-in-out"></div>
    </div>
   </div>
   <div class="container">
    <h1>Linear</h1>
    <div class="line">
      <div class="circle linear"></div>
    </div>
   </div>
   <div class="container">
    <h1>Steps</h1>
    <div class="line">
      <div class="circle steps"></div>
    </div>
   </div>
</body>

</html>
